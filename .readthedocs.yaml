# .readthedocs.yaml
# Read the Docs configuration file.

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.10"
  commands:
    - properdocs build -f docs/properdocs.yml --site-dir $READTHEDOCS_OUTPUT/html

python:
  install:
    # Install dependencies with 'doc' dependency group
    - method: uv
      command: sync
      groups:
        - docs
